[project]
name = "machine-vision-project"
version = "0.1.0"
description = "3D face modeling and webcam authentication with MediaPipe and OpenCV."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "mediapipe",
    "opencv-python",
    "open3d",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
