version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv:
        patterns:
          - "*"
    ignore:
      # MediaPipe 0.10.x hard-pins protobuf>=4.25.3,<5, so any protobuf 5.x/6.x
      # bump cannot resolve (this is what kept failing the Dependabot job).
      # Drop these ignores when mediapipe 1.x is adopted.
      - dependency-name: "protobuf"
        versions: [">=5"]
      # mediapipe 1.x removes the legacy FaceMesh API this pipeline uses
      # (see commit 73ed944); minor bumps within 0.10.x stay allowed.
      - dependency-name: "mediapipe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
